issuer: http://localhost:9090/realms/projectWAII
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}

keycloak:
  token-uri: http://localhost:9090/realms/projectWAII/protocol/openid-connect/token
  client-id: credential-flow-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
