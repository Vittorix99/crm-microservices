spring.application.name=WALab4

server.port=8081

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=${CRM_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

gmail-account.application_name="WALab4"
gmail.client-id=${GMAIL_CLIENT_ID}
gmail.client-secret=${GMAIL_CLIENT_SECRET}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN}
gmail.mail=${GMAIL_MAIL}



camel.component.google-mail-stream.application-name=${gmail.application_name}
camel.component.google-mail-stream.client-id=${gmail.client-id}
camel.component.google-mail-stream.client-secret=${gmail.client-secret}
camel.component.google-mail-stream.refresh-token=${gmail.refresh-token}

camel.component.google-mail.application-name=${gmail.application_name}
camel.component.google-mail.client-id=${gmail.client-id}
camel.component.google-mail.client-secret=${gmail.client-secret}
camel.component.google-mail.refresh-token=${gmail.refresh-token}
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.kafka.producer.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.client-id=producer


